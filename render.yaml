# Render Blueprint. Connect this repo in the dashboard with New → Blueprint.
# Deploys wait for the GitHub Actions CI check, then ship one free web service.
# Free instances have no disk. The database is the committed storefront.db,
# copied into /tmp on each boot. Records added in the admin last until Render
# restarts or spins the service down.
services:
  - type: web
    name: piaci
    runtime: docker
    branch: main
    plan: free
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: STOREFRONT_DB
        value: /tmp/storefront.db
      - key: PYTHONUNBUFFERED
        value: "1"
